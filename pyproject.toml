[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "absa-olist"
version = "0.1.0"
description = "Análise de Sentimentos Baseada em Aspectos em avaliações de e-commerce (Olist)"
authors = [{ name = "Vitor Neves de Lima" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "unidecode>=1.3",
]

[project.optional-dependencies]
# Ajuste fino de encoders (BERTimbau, Albertina) — usar no Colab com GPU
transformers = ["torch>=2.1", "transformers>=4.44", "accelerate>=0.30"]
# Rotulagem por LLM local quantizado (Colab T4)
llm = ["torch>=2.1", "transformers>=4.44", "accelerate>=0.30", "bitsandbytes>=0.43"]
# Explicabilidade, equidade e auditoria de rótulos
analise = ["lime>=0.2", "fairlearn>=0.10", "cleanlab>=2.6", "matplotlib>=3.7", "seaborn>=0.13"]
# Lematização para a linha de base clássica
nlp = ["spacy>=3.7"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
